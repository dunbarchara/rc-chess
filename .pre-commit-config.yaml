# Secret scanning only. Optional locally (`pre-commit install`); CI is the enforced gate.

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # On a commit this scans only what is staged (the hook's own `--staged`).
      - id: gitleaks
      # The same scanner over every commit on every branch. CI runs it
      # (`pre-commit run gitleaks-history --hook-stage manual --all-files`).
      - id: gitleaks
        alias: gitleaks-history
        name: Detect hardcoded secrets (full history)
        entry: gitleaks git --redact --verbose --log-opts=--all
        stages: [manual]
